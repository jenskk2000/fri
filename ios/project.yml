name: FRI
options:
  bundleIdPrefix: dk.fri
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
targets:
  FRI:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: FRIWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.fri.app
        INFOPLIST_KEY_CFBundleDisplayName: FRI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: da
        CFBundleLocalizations: [da]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Montserrat-ExtraBold.ttf, Inter.ttf]
        UILaunchScreen:
          UIColorName: LaunchPaper
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [fri]
        NSUserNotificationsUsageDescription: En venlig påmindelse om din plan, når du selv ønsker det.
    entitlements:
      path: Config/FRI.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.fri.shared]
  FRIWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.fri.app.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: da
        CFBundleDisplayName: FRI
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.fri.shared]
  FRIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: FRI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dk.fri.uitests
schemes:
  FRI:
    build:
      targets:
        FRI: all
        FRIWidgets: all
        FRIUITests: [test]
    test:
      targets: [FRIUITests]
